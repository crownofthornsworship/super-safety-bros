<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#0a2031">
  <meta name="description" content="Choose Nick or Travis and protect the campus across ten original platforming stages, three worlds, and a final boss fight.">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Super Safety Bros | Salt &amp; Light Games">
  <meta property="og:description" content="Choose Nick or Travis across three worlds, ten original stages, new hazards and enemies, and a final boss fight.">
  <meta property="og:url" content="https://crownofthornsworship.github.io/super-safety-bros/">
  <meta property="og:image" content="https://crownofthornsworship.github.io/super-safety-bros/social-preview.png?v=5">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Nick and Travis as the illustrated heroes of Super Safety Bros">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Super Safety Bros | Salt &amp; Light Games">
  <meta name="twitter:description" content="Three worlds. Ten stages. New hazards and enemies. One final boss fight.">
  <meta name="twitter:image" content="https://crownofthornsworship.github.io/super-safety-bros/social-preview.png?v=5">
  <title>Super Safety Bros | Salt &amp; Light Games</title>
  <link rel="icon" type="image/png" sizes="512x512" href="icon-512.png?v=5">
  <link rel="apple-touch-icon" href="icon-512.png?v=5">
  <link rel="stylesheet" href="styles.css?v=6">
  <link rel="stylesheet" href="gameplay-v4.css?v=6">
</head>
<body>
  <main id="app">
    <section id="menu" class="screen active" aria-labelledby="game-title">
      <div class="badge">A SALT &amp; LIGHT GAME</div>
      <h1 id="game-title"><span>SUPER</span> SAFETY BROS</h1>
      <p class="tagline">Faithful. Watchful. Ready.</p>
      <p class="world-count">3 WORLDS · 10 STAGES · FINAL BOSS</p>
      <div class="character-grid" aria-label="Choose your safety brother">
        <button class="character-card selected" data-character="travis">
          <img src="travis-idle.png?v=3" alt="Travis game character">
          <strong>TRAVIS</strong><small>Steady &amp; Strong</small>
        </button>
        <button class="character-card" data-character="nick">
          <img src="nick-idle.png?v=3" alt="Nick game character">
          <strong>NICK</strong><small>Quick &amp; Alert</small>
        </button>
      </div>
      <button id="start" class="primary">START PATROL</button>
      <p class="controls-hint">Move: A/D or ←/→ &nbsp; • &nbsp; Jump: W, ↑, or Space</p>
    </section>

    <section id="game-screen" class="screen" aria-label="Game area">
      <header class="hud">
        <div><small>SAFETY BRO</small><strong id="hud-name">TRAVIS</strong></div>
        <div><small>LIVES</small><strong id="lives">♥ ♥ ♥</strong></div>
        <div><small>LEVEL</small><strong id="level">1-1</strong></div>
        <div><small>RADIOS</small><strong>📻 <span id="score">0</span>/<span id="radio-total">8</span></strong></div>
        <div><small>MISSION</small><strong id="mission">PATROL</strong></div>
      </header>
      <canvas id="game" width="1280" height="720"></canvas>
      <button id="pause" aria-label="Pause game">Ⅱ</button>
      <div class="mobile-controls" aria-label="Touch controls">
        <button data-key="left" aria-label="Move left">◀</button>
        <button data-key="right" aria-label="Move right">▶</button>
        <button data-key="jump" class="jump" aria-label="Jump">▲</button>
      </div>
    </section>

    <section id="result" class="screen" aria-live="polite">
      <div class="result-card">
        <div class="result-star">★</div>
        <h2 id="result-title">Campus Secured!</h2>
        <p id="result-copy">Great patrol, Safety Bro.</p>
        <button id="again" class="primary">NEXT LEVEL</button>
        <button id="characters" class="secondary">CHANGE CHARACTER</button>
      </div>
    </section>
  </main>
  <footer>⚡ <a href="https://venmo.com/u/MTA-7777" target="_blank" rel="noopener">Buy Mike a C4 · @MTA-7777</a></footer>
  <script src="game.js?v=6"></script>
</body>
</html>
